env:
  AWS_REGION: eu-west-2

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-dev:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Installs Terraform on the GitHub runner
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      # Configures AWS access by using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@9dfa9aa010133d4807cd0272ad05d3fdb5b01340
        with:
          role-to-assume: arn:aws:iam::241661649258:role/github-actions-ecsv2
          role-session-name: tf-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format
        working-directory: ./infra//env/dev
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./infra//env/dev
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ./infra/env/dev
        run: terraform validate

      # Download the plan artifact produced by PR to dev run
      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: ./terraform/tfplan-dev
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Terraform Init
        working-directory: ./infra/env/dev
        run: terraform init -input=false

      - name: Terraform Apply (exact saved plan)
        working-directory: ./infra/env/dev
        # if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: terraform apply -no-color -input=false tfplan-dev
        