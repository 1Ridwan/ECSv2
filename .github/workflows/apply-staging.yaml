name: Terraform Apply to Staging

# on:
#   pull_request:
#     paths: ['**.tf', '**.tfvars']
#   push:
#     branches: [main]

on:
  pull_request:
    paths:
          - 'infra/modules/**'
    branches: [staging]
    types:
      - closed

env:
  AWS_REGION: eu-west-2

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:

  if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo The PR to staging branch was merged

  tfapply-staging:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      # Installs Terraform on the GitHub runner
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      # Configures AWS access by using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@9dfa9aa010133d4807cd0272ad05d3fdb5b01340
        with:
          role-to-assume: arn:aws:iam::241661649258:role/github-actions-ecsv2
          role-session-name: tfapply-staging
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./infra/env/staging
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ./infra/env/staging
        run: terraform apply -auto-approve -var-file staging.tfvars  